name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Docker Compose config
        run: docker compose config -q

      - name: Test
        run: go test ./... -race -cover

  browser-event-volume:
    name: Browser PostgreSQL contract (migration, old Worker, 1/500, CallRecord)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the fail-closed Browser PostgreSQL acceptance
        run: ./scripts/test-browser-event-volume.sh

  runtime-dispatch:
    name: Runtime dispatch PostgreSQL and WebSocket regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openlinker_test
          POSTGRES_PASSWORD: openlinker_test
          POSTGRES_DB: openlinker_dispatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlinker_test -d openlinker_dispatch"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://openlinker_test:openlinker_test@localhost:5432/openlinker_dispatch?sslmode=disable
      TEST_DATABASE_URL: postgres://openlinker_test:openlinker_test@localhost:5432/openlinker_dispatch?sslmode=disable
      JWT_SECRET: runtime-dispatch-integration-only-secret
      MIGRATIONS_DIR: ./migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Initialize disposable current schema
        run: go run ./cmd/api migrate up
      - name: Prove current and predecessor schema fingerprints
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./pkg/migrationinit -count=1 | tee /tmp/migrationinit.log
          if grep -q -- '--- SKIP:' /tmp/migrationinit.log; then exit 1; fi
          grep -q -- '--- PASS: TestCLILoginRollbackAndReapplyIntegration' /tmp/migrationinit.log
      - name: Prove CLI authorization against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          go test -race -v ./pkg/usertoken -run 'TestCLILogin|TestServiceCreateVerify' -count=1 | tee /tmp/cli-login.log
          if grep -q -- '--- SKIP:' /tmp/cli-login.log; then exit 1; fi
          grep -q -- '--- PASS: TestCLILoginConcurrentExchangeMintsOnceIntegration' /tmp/cli-login.log
      - name: Prove Skill publication and scoped MCP contracts against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          go test -race -v ./pkg/runtime -run '^(TestSkillPlatformClientAuthorityIntegration|TestSkillPackageLifecycle|TestSkillPackagePublicationAndImport|TestAgentScopedMCPEndpoint|TestResourceMetadataPublicationPrivacyAndDirectory|TestMCPRuntimeCreatesTrustedConversation|TestMCPRuntimeReplaysPreContextIdentity|TestMCPConversationDefaultsPreserveOtherEntrypoints|TestMCPRuntimeConcurrentContextCreation)$' -count=1 | tee /tmp/resource-contracts.log
          if grep -q -- '--- SKIP:' /tmp/resource-contracts.log; then
            echo "Skill and MCP PostgreSQL contracts must not skip" >&2
            exit 1
          fi
          for name in TestSkillPlatformClientAuthorityIntegration TestSkillPackageLifecycle TestSkillPackagePublicationAndImport TestAgentScopedMCPEndpoint TestResourceMetadataPublicationPrivacyAndDirectory TestMCPRuntimeCreatesTrustedConversation TestMCPRuntimeReplaysPreContextIdentity TestMCPConversationDefaultsPreserveOtherEntrypoints TestMCPRuntimeConcurrentContextCreation; do
            grep -q -- "--- PASS: ${name} " /tmp/resource-contracts.log
          done

      - name: Prove dispatch without a compensation worker
        shell: bash
        run: |
          set -euo pipefail
          go test -race -v ./pkg/runtime -run 'TestConcurrentRuntimeDispatchWithoutCompensation|TestRuntimeClaimReferenceLockCompatibilityAndExclusion|TestRuntimeDispatchWake' -count=3 -timeout=3m | tee /tmp/runtime-dispatch.log
          if grep -q -- '--- SKIP:' /tmp/runtime-dispatch.log; then
            echo "Runtime dispatch regressions must not skip" >&2
            exit 1
          fi
          grep -q -- '--- PASS: TestConcurrentRuntimeDispatchWithoutCompensation' /tmp/runtime-dispatch.log
          grep -q -- '--- PASS: TestRuntimeClaimReferenceLockCompatibilityAndExclusion' /tmp/runtime-dispatch.log
      - name: Prove cancellation survives Run lock contention
        shell: bash
        run: |
          set -euo pipefail
          go test -race -v ./pkg/runtime -run 'TestRuntimeCancellation|TestRuntimeWebSocketCancellationRetry|TestRuntimePullCancellationContention' -count=3 -timeout=3m | tee /tmp/runtime-cancellation.log
          if grep -q -- '--- SKIP:' /tmp/runtime-cancellation.log; then
            echo "Runtime cancellation regressions must not skip" >&2
            exit 1
          fi
          grep -q -- '--- PASS: TestRuntimeCancellationContentionRetriesWithoutCompensation' /tmp/runtime-cancellation.log
          grep -q -- '--- PASS: TestRuntimeCancellationHTTPContentionRetriesWithoutWake' /tmp/runtime-cancellation.log
          grep -q -- '--- PASS: TestRuntimeCancellationNormalAppendSerializesOnSession' /tmp/runtime-cancellation.log
          grep -q -- '--- PASS: TestRuntimeCancellationPresenceUsesSessionAndDeadline' /tmp/runtime-cancellation.log


  node-upgrade:
    name: Controlled Node migration, lifecycle and capacity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openlinker_test
          POSTGRES_PASSWORD: openlinker_test
          POSTGRES_DB: openlinker_upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlinker_test -d openlinker_upgrade"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://openlinker_test:openlinker_test@localhost:5432/openlinker_upgrade?sslmode=disable
      TEST_DATABASE_URL: postgres://openlinker_test:openlinker_test@localhost:5432/openlinker_upgrade?sslmode=disable
      JWT_SECRET: runtime-upgrade-integration-only-secret
      MIGRATIONS_DIR: ./migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Initialize disposable current schema
        run: go run ./cmd/api migrate up
      - name: Prove controlled Node operations and renewal fences
        shell: bash
        env:
          RUNTIME_NODE_UPGRADE_CAPACITY: "1"
        run: |
          set -euo pipefail
          go test -p 1 -race -v ./pkg/runtime ./pkg/runtimepki -run '^TestRuntimeNodeControlled|^TestCredentialIssuanceReplaysCommittedLeafWithinMinimumInterval$' -count=1 -timeout=8m | tee /tmp/node-upgrade.log
          if grep -q -- '--- SKIP:' /tmp/node-upgrade.log; then exit 1; fi
          grep -q -- '--- PASS: TestRuntimeNodeControlledUpgradeTotalBudget' /tmp/node-upgrade.log
          grep -q -- '--- PASS: TestRuntimeNodeControlledUpgradeScopeChangeRetries' /tmp/node-upgrade.log
          grep -q -- '--- PASS: TestRuntimeNodeControlledUpgradeCapacity' /tmp/node-upgrade.log
      - name: Measure upgrade and normal Run latency under database delay and load
        shell: bash
        env:
          RUNTIME_NODE_UPGRADE_CAPACITY: "1"
          RUNTIME_NODE_UPGRADE_CAPACITY_LOAD: "1"
        run: |
          set -euo pipefail
          go test -v ./pkg/runtime -run '^TestRuntimeNodeControlledUpgrade(Capacity|SupersededHistory)$' -count=1 -timeout=8m | tee /tmp/node-upgrade-load.log
          if grep -q -- '--- SKIP:' /tmp/node-upgrade-load.log; then exit 1; fi
          grep -q -- '--- PASS: TestRuntimeNodeControlledUpgradeCapacity' /tmp/node-upgrade-load.log
          grep -q -- '--- PASS: TestRuntimeNodeControlledUpgradeSupersededHistory' /tmp/node-upgrade-load.log
