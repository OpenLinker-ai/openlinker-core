name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Docker Compose config
        run: docker compose config -q

      - name: Test
        run: go test ./... -race -cover

  browser-event-volume:
    name: Browser PostgreSQL contract (migration, old Worker, 1/500, CallRecord)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the fail-closed Browser PostgreSQL acceptance
        run: ./scripts/test-browser-event-volume.sh
