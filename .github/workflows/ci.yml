name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Docker Compose config
        run: docker compose config -q

      - name: Test
        run: go test ./... -race -cover

  browser-event-volume:
    name: Browser PostgreSQL contract (migration, old Worker, 1/500, CallRecord)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the fail-closed Browser PostgreSQL acceptance
        run: ./scripts/test-browser-event-volume.sh

  runtime-dispatch:
    name: Runtime dispatch PostgreSQL and WebSocket regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openlinker_test
          POSTGRES_PASSWORD: openlinker_test
          POSTGRES_DB: openlinker_dispatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlinker_test -d openlinker_dispatch"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://openlinker_test:openlinker_test@localhost:5432/openlinker_dispatch?sslmode=disable
      TEST_DATABASE_URL: postgres://openlinker_test:openlinker_test@localhost:5432/openlinker_dispatch?sslmode=disable
      JWT_SECRET: runtime-dispatch-integration-only-secret
      MIGRATIONS_DIR: ./migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Initialize disposable current schema
        run: go run ./cmd/api migrate up
      - name: Prove dispatch without a compensation worker
        shell: bash
        run: |
          set -euo pipefail
          go test -race -v ./pkg/runtime -run 'TestConcurrentRuntimeDispatchWithoutCompensation|TestRuntimeClaimReferenceLockCompatibilityAndExclusion|TestRuntimeDispatchWake' -count=3 -timeout=3m | tee /tmp/runtime-dispatch.log
          if grep -q -- '--- SKIP:' /tmp/runtime-dispatch.log; then
            echo "Runtime dispatch regressions must not skip" >&2
            exit 1
          fi
          grep -q -- '--- PASS: TestConcurrentRuntimeDispatchWithoutCompensation' /tmp/runtime-dispatch.log
          grep -q -- '--- PASS: TestRuntimeClaimReferenceLockCompatibilityAndExclusion' /tmp/runtime-dispatch.log
